\* Arithmetic runs before the type check. A foreign argument throws, so
\* NeverThrows fails. This reversed configuration must not pass.
SPECIFICATION Spec
CONSTANTS
  CoerceFirst = TRUE
  MaxCalls = 4
INVARIANTS
  TypeOK
  NeverThrows
  CursorTracksAssignment
PROPERTIES
  LatchStable
  FrozenAfterLatch
