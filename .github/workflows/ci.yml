name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-2025 ]
        node: [ 20, 22 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: "Test (dev: checked write path)"
        run: node --test
      # The write path forks at module load on NODE_ENV (src/mode.js): the
      # dev leg above runs the CHECKED variants, this leg re-proves the wire,
      # the read trust boundary and the caller-trust contract under the
      # PRODUCTION variants. The runner pins NODE_ENV=production in the child
      # itself, so the leg cannot silently run in dev mode on any OS.
      - name: Test (production write path)
        run: node production-tests.mjs

  # STANDARD.md here is a VERBATIM VENDORED COPY of the specification in
  # mas-bandwidth/serialize. A duplicated normative document is the same
  # failure as a duplicated constant, except it drifts silently. This job
  # mirrors serialize.c's: fetch upstream, diff, and record the upstream
  # SHA so a green run says what it was green against.
  standard:
    name: STANDARD.md matches upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare against mas-bandwidth/serialize
        run: |
          curl -fsSL -o /tmp/upstream-STANDARD.md \
            https://raw.githubusercontent.com/mas-bandwidth/serialize/main/STANDARD.md
          echo "upstream: mas-bandwidth/serialize@$(git ls-remote https://github.com/mas-bandwidth/serialize.git refs/heads/main | cut -f1)"
          diff -u /tmp/upstream-STANDARD.md STANDARD.md
